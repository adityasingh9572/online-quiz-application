<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Online Quiz Application with multiple categories, timer and score calculation">
    <title>QuizMaster - Online Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app">

        <div class="start-screen" id="startScreen">
            <div class="logo">QuizMaster</div>

            <h1>Test Your Knowledge</h1>

            <p>
                Choose a category and challenge yourself with our interactive quiz.
            </p>

            <div class="category-title">
                Select Category
            </div>

            <div class="categories">

                <button class="category active" data-category="general">
                    General Knowledge
                </button>

                <button class="category" data-category="science">
                    Science
                </button>

                <button class="category" data-category="technology">
                    Technology
                </button>

                <button class="category" data-category="web">
                    Web Development
                </button>

            </div>

            <button class="start-btn" id="startBtn">
                Start Quiz
            </button>
        </div>


        <div class="quiz-screen hidden" id="quizScreen">

            <div class="quiz-header">

                <div>
                    <span class="small-text">Category</span>
                    <strong id="categoryName">General Knowledge</strong>
                </div>

                <div class="timer">
                    <span>⏱</span>
                    <span id="timer">30</span>
                </div>

            </div>

            <div class="progress-area">

                <div class="progress-info">
                    <span id="questionNumber">Question 1 of 10</span>
                    <span id="scoreDisplay">Score: 0</span>
                </div>

                <div class="progress-bar">
                    <div id="progress"></div>
                </div>

            </div>

            <div class="question-card">

                <h2 id="question">
                    Question goes here
                </h2>

                <div id="options" class="options"></div>

            </div>

            <div class="quiz-footer">

                <button id="nextBtn" class="next-btn" disabled>
                    Next Question
                </button>

            </div>

        </div>


        <div class="result-screen hidden" id="resultScreen">

            <div class="result-icon">🏆</div>

            <h1>Quiz Completed!</h1>

            <p id="resultMessage">
                Great job!
            </p>

            <div class="result-card">

                <div class="result-item">
                    <span>Total Questions</span>
                    <strong id="totalQuestions">10</strong>
                </div>

                <div class="result-item">
                    <span>Correct Answers</span>
                    <strong id="correctAnswers">0</strong>
                </div>

                <div class="result-item">
                    <span>Wrong Answers</span>
                    <strong id="wrongAnswers">0</strong>
                </div>

                <div class="result-item">
                    <span>Your Score</span>
                    <strong id="finalScore">0%</strong>
                </div>

            </div>

            <button id="restartBtn" class="start-btn">
                Try Again
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
